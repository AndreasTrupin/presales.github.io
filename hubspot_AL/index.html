<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #f5f8fa;
  }

  :root {
    --zoom: 0.8;        /* zoom souhaité */
    --sidebar: 300px;   /* largeur RÉELLE du bandeau contact à masquer — à remesurer avec l'inspecteur */
    --topbar: 56px;      /* hauteur RÉELLE de la barre du haut à masquer — à remesurer */
  }

  .viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;      /* passe à "auto" si tu veux pouvoir scroller ce qui est coupé */
  }

  .zoom-wrap {
    position: absolute;
    top: calc(var(--topbar) * -1 * var(--zoom));
    left: calc(var(--sidebar) * -1 * var(--zoom));
    width: calc(100% / var(--zoom) + var(--sidebar));
    height: calc(100% / var(--zoom) + var(--topbar));
    transform: scale(var(--zoom));
    transform-origin: 0 0;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    pointer-events: auto; /* garde l'interactivité si tu passes .viewport en overflow:auto */
  }
</style>
