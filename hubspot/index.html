
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed HubSpot - Fiche contact</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #f5f8fa;
  }

  /* ----- réglage du dézoom -----
     0.8 = 80% (comme pour la page WhatsApp), on peut descendre à 0.7, 0.6...
     plus la valeur est petite, plus on voit "large" mais plus petit visuellement */
  :root {
    --zoom: 0.8;
  }

  .zoom-wrap {
    width: calc(100% / var(--zoom));
    height: calc(100% / var(--zoom));
    transform: scale(var(--zoom));
    transform-origin: 0 0;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

<div class="zoom-wrap">
  <iframe
    src="https://app.hubspot.com/contacts/19534769/record/0-1/248048780853"
    referrerpolicy="no-referrer-when-downgrade"
    allow="clipboard-read; clipboard-write"
  ></iframe>
</div>

</body>
</html>
