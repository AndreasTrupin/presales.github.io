<!doctype html>
<html>
<head>
<style>
  :root { --s: 0.67; }              /* 0.67 = plus dézoomé, 0.8 = plus lisible */
  html, body { margin:0; height:100%; overflow:hidden; }
  iframe {
    width:  calc(100vw / var(--s));
    height: calc(100vh / var(--s));
    transform: scale(var(--s));
    transform-origin: 0 0;
    border: 0;
  }
</style>
</head>

</body>
</html>
